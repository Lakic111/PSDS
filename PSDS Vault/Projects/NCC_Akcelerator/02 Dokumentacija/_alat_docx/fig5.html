<!doctype html><meta charset='utf-8'><style>
  @page { size: A4; margin: 20mm 18mm 18mm 18mm; }

  html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }

  body {
    font-family: "Times New Roman", Times, serif;
    font-size: 11.5pt;
    line-height: 1.45;
    color: #000;
    margin: 0;
    text-align: justify;
    hyphens: auto;
  }

  p { margin: 0 0 0.55em 0; text-indent: 1.2em; }
  p.noind, li p { text-indent: 0; }

  h1 {
    font-size: 15pt; font-weight: bold; margin: 0 0 0.9em 0;
    page-break-before: always; page-break-after: avoid;
  }
  h1.first { page-break-before: avoid; }
  h2 { font-size: 12.5pt; margin: 1.3em 0 0.5em 0; page-break-after: avoid; }
  h3 { font-size: 11.5pt; margin: 1.1em 0 0.4em 0; page-break-after: avoid; }

  /* ---------- naslovna ---------- */
  .cover { page-break-after: always; text-align: center; padding-top: 45mm; }
  .cover .fac { font-size: 12pt; letter-spacing: .02em; }
  .cover .subj { font-size: 13pt; margin-top: 26mm; font-variant: small-caps; }
  .cover .title {
    font-size: 21pt; font-weight: bold; margin: 8mm 14mm 0 14mm; line-height: 1.3;
  }
  .cover .sub { font-size: 13pt; margin-top: 6mm; }
  .cover .rule { border-top: 1.4pt solid #000; width: 70%; margin: 9mm auto; }
  .cover .meta { font-size: 12pt; margin-top: 20mm; line-height: 1.9; }
  .cover .foot { margin-top: 34mm; font-size: 11pt; }

  /* ---------- sadrzaj ---------- */
  .toc { page-break-after: always; }
  .toc h1 { text-align: center; page-break-before: avoid; }
  .toc ul { list-style: none; margin: 0; padding: 0; }
  .toc li { margin: 0.18em 0; text-align: left; }
  .toc li.l1 { font-weight: bold; margin-top: 0.7em; }
  .toc li.l2 { padding-left: 1.6em; font-size: 11pt; }
  .toc li.l3 { padding-left: 3.2em; font-size: 10.5pt; }

  /* ---------- tabele ---------- */
  table {
    border-collapse: collapse; width: 100%; margin: 0.7em 0 0.25em 0;
    font-size: 10pt; page-break-inside: avoid;
  }
  caption { caption-side: bottom; font-size: 9.5pt; font-style: italic;
            padding-top: 0.4em; text-align: center; }
  caption b { font-style: normal; }
  th, td { padding: 3.5px 7px; text-align: left; vertical-align: top; }
  thead th { border-top: 1.1pt solid #000; border-bottom: 0.7pt solid #000;
             font-weight: bold; text-align: center; }
  tbody tr:last-child td { border-bottom: 1.1pt solid #000; }
  td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
  td.c, th.c { text-align: center; }
  tbody tr.sep td { border-top: 0.4pt solid #999; }

  /* ---------- kod / formule ---------- */
  code, .mono { font-family: Consolas, "Courier New", monospace; font-size: 9.6pt; }
  pre {
    font-family: Consolas, "Courier New", monospace; font-size: 9.2pt;
    line-height: 1.32; background: #f6f6f4; border: 0.5pt solid #ccc;
    padding: 7px 9px; margin: 0.6em 0; overflow-x: auto;
    page-break-inside: avoid; text-align: left; white-space: pre;
  }
  .formula {
    text-align: center; margin: 0.9em 0; font-size: 12pt; font-style: italic;
    page-break-inside: avoid;
  }
  .formula .frac { display: inline-block; vertical-align: middle; text-align: center; }
  .formula .frac > .num { display: block; padding: 0 .5em 2px .5em; border-bottom: 1pt solid #000; }
  .formula .frac > .den { display: block; padding: 2px .5em 0 .5em; }
  /* kvadratni koren koji se rasteže preko celog potkorenog izraza */
  .sqrt { display: inline-flex; align-items: stretch; }
  .sqrt > svg { width: .62em; height: auto; align-self: stretch; margin-right: 1px; overflow: visible; }
  .sqrt > .radicand { border-top: 1.15pt solid #000; padding: 2px 3px 0 2px; }

  /* ---------- figure ---------- */
  figure { margin: 1em 0 0.4em 0; text-align: center; page-break-inside: avoid; }
  figcaption { font-size: 9.5pt; font-style: italic; margin-top: 0.45em; text-align: center; }
  figcaption b { font-style: normal; }
  svg { max-width: 100%; height: auto; }
  /* Visoke slike: ograniči visinu tako da slika i potpis stanu na istu stranu. */
  figure.tall { page-break-before: always; }
  figure.tall svg { max-height: 236mm; width: auto; }

  .note {
    border-left: 2.5pt solid #555; background: #f4f4f2;
    padding: 6px 11px; margin: 0.8em 0; font-size: 10.3pt;
    page-break-inside: avoid;
  }
  .note p { text-indent: 0; margin: 0 0 .35em 0; }
  .note p:last-child { margin-bottom: 0; }

  ul.plain, ol.plain { margin: 0.4em 0 0.7em 0; padding-left: 1.5em; }
  ul.plain li, ol.plain li { margin-bottom: 0.28em; }

  .kv { font-variant-numeric: tabular-nums; }
  .ok  { font-weight: bold; }
